name: nightly

on:
  push:
    branches: [master, main]
  schedule:
    # 北京时间 00:00 / 06:00 / 12:00 / 18:00 (UTC 16/22/04/10 点), 每天四次
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # legacy: 同步上游 ko + susfs_insmod, 产物与 update.json / changelog.md 写入 modules/
      # GH_TOKEN 用于提高 GitHub API 限额
      - name: Pack legacy
        shell: pwsh
        working-directory: legacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUSFS_UPDATE_JSON_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/modules/update.json
          SUSFS_ZIP_URL_BASE: https://github.com/${{ github.repository }}/releases/download/nightly/
        run: ./pack.ps1

      # next: 冻结版本, 仅打包本地内容
      - name: Pack next
        shell: pwsh
        working-directory: next
        run: ./pack.ps1

      # modules/ (zip + update.json + changelog.md) 与 legacy/build/ (上游同步结果) 提交回仓库
      # [skip ci] 防止本次提交再次触发工作流
      - name: Commit modules
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules shared legacy next
          git diff --cached --quiet || git commit -m "Update modules [skip ci]"
          git push

      # 固定 nightly 标签原地覆盖更新 zip 产物, 下载地址恒定
      - name: Upload nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          files: modules/*.zip
